<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OCR File Finder</title>
    <link rel="icon" href="/img/fav_icon.png" type="image/png">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ahseven7.tailfb43bc.ts.net/">
    <meta property="og:title" content="OCR File Finder">
    <meta property="og:description" content="Upload and search your pdf/image content with ease.">
    <meta property="og:image" content="https://ahseven7.tailfb43bc.ts.net/img/banner.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OCR File Finder">
    <meta name="twitter:description" content="Upload and search your pdf/image content with ease.">
    <meta name="twitter:image" content="https://ahseven7.tailfb43bc.ts.net/img/banner.png">

    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

<body>
    <div class="terminal">
        <header>
            <h1>>_ OCR File Finder</h1>
            <p>Find and filter file name based on the content strings!</p>
        </header>

        <section id="upload-zone" class="drop-zone">
            <p>[DRAG & DROP, COPY & PASTE OR CLICK TO UPLOAD FILES HERE]</p>
            <input type="file" id="file-input" accept="image/*,.pdf" multiple hidden>
        </section>
        <div id="upload-status"></div>
        <div id="processing-status" class="status-panel"></div>

        <section class="search-section">
            <label for="search-input">Query Database > </label>
            <input type="text" id="search-input" placeholder="Enter keyword..." autocomplete="off">
            <button id="show-all-btn" type="button">SHOW ALL</button>
        </section>

        <section id="results" class="results-container">
            <!-- Results injected here via JS -->
        </section>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
